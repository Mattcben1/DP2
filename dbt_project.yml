name: 'package_health'
version: '1.0.0'
profile: 'package_health'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Start of the analysis window. main.py overrides it with --vars so DEV_MODE controls dbt too.
vars:
  window_start: '2024-01-01'

# Staging models are thin views over raw JSON; facts and marts are tables that Tasks 4-6 read.
models:
  package_health:
    staging:
      +materialized: view
    marts:
      +materialized: table
